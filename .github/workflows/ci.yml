name: Elvora CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-test:
    name: Lint, Typecheck, Test & Production Build
    runs-on: ubuntu-latest

    env:
      # Secrets retrieved securely from GitHub Repository Secrets Manager
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'mongodb://localhost:27017/elvora_ci?replicaSet=rs0' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_super_secret_jwt_key_elvora_2026_ci_testing_only' }}
      ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET || 'ci_super_secret_admin_jwt_key_elvora_2026_ci_testing_only' }}
      BILLING_PROVIDER: mock
      NODE_ENV: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: 1. Code Linting (ESLint)
        run: npm run lint

      - name: 2. TypeScript Static Analysis (tsc)
        run: npm run type-check

      - name: 3. Automated Vitest Test Suite (Unit, Integration, Security & Adversarial)
        run: npm test

      - name: 4. Next.js Production Build Verification
        run: npm run build
